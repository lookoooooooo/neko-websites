<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヨラ、私を信じてくれる？</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000000;
            color: #ffffff;
            font-family: "MS Mincho", "New York", serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
        }

        #canvas-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 700px;
            background: #030303;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scene-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease-in-out, filter 1.5s ease-in-out;
            opacity: 0;
            pointer-events: none;
            filter: blur(15px);
        }

        .scene-container.active {
            opacity: 1;
            pointer-events: auto;
            filter: blur(0px);
        }

        .text-overlay {
            position: absolute;
            bottom: 15%;
            width: 85%;
            text-align: center;
            font-size: 20px;
            line-height: 2;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .title-text {
            font-size: 40px;
            margin-bottom: 25px;
            color: #ffffff;
            letter-spacing: 0.3em;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        .visual-element {
            position: absolute;
            font-size: 90px;
            opacity: 0.2;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
            animation: float 7s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(4deg); }
        }

        .nav-trigger {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 12%;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.1);
            font-size: 36px;
            font-family: monospace;
            cursor: pointer;
            z-index: 10;
            transition: color 0.4s, background 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-trigger:hover {
            color: rgba(255, 255, 255, 0.6);
            background: linear-gradient(to right, rgba(255,255,255,0.02), transparent);
        }

        #prev-btn { left: 0; }
        #next-btn { right: 0; }
        #next-btn:hover { background: linear-gradient(to left, rgba(255,255,255,0.02), transparent); }

        .sc-01 { background: radial-gradient(circle, #0f0f14 0%, #000000 100%); }
        .sc-02 { background: radial-gradient(circle, #140f0f 0%, #000000 100%); }
        .sc-03 { background: radial-gradient(circle, #0f1411 0%, #000000 100%); }
        .sc-04 { background: radial-gradient(circle, #130f14 0%, #000000 100%); }
        .sc-05 { background: radial-gradient(circle, #111111 0%, #000000 100%); }
    </style>
</head>
<body>

    <div id="canvas-screen">
        
        <button class="nav-trigger" id="prev-btn">&lt;</button>
        <button class="nav-trigger" id="next-btn">&gt;</button>

        <!-- Scene 1 -->
        <div class="scene-container sc-01 active">
            <div class="visual-element" style="top: 25%; left: 45%;">🌧️</div>
            <div class="text-overlay">
                深く、重い、灰色の毎日。<br>
                心が擦り切れていく。
            </div>
        </div>

        <!-- Scene 2 -->
        <div class="scene-container sc-02">
            <div class="visual-element" style="top: 30%; left: 35%; animation-delay: -2s;">👁️</div>
            <div class="text-overlay">
                現実が歪み始める。<br>
                そこにいないはずの影が、静かに揺れていた。
            </div>
        </div>

        <!-- Scene 3 -->
        <div class="scene-container sc-03">
            <div class="visual-element" style="top: 35%; left: 55%; animation-delay: -4s;">⏳</div>
            <div class="text-overlay">
                意識がゆっくりと、闇の底へ沈んでいく。<br>
                深い眠りが、すべてを包み込んだ。
            </div>
        </div>

        <!-- Scene 4 -->
        <div class="scene-container sc-04">
            <div class="visual-element" style="top: 20%; left: 50%; font-size: 100px; animation-delay: -1s;">🦋</div>
            <div class="text-overlay">
                目を覚ますと、そこは見たこともない世界だった。<br>
                美しく、歪んだ、幻覚の境界線。
            </div>
        </div>

        <!-- Scene 5: Final Title / Question -->
        <div class="scene-container sc-05">
            <div class="text-overlay" style="bottom: 35%;">
                <div class="title-text">ヨラ</div>
                私を信じてくれる？
            </div>
        </div>

    </div>

    <script>
        let activeIndex = 0;
        const scenes = document.querySelectorAll('.scene-container');
        const maxIndex = scenes.length;

        document.getElementById('next-btn').addEventListener('click', () => {
            scenes[activeIndex].classList.remove('active');
            activeIndex = (activeIndex + 1) % maxIndex;
            scenes[activeIndex].classList.add('active');
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            scenes[activeIndex].classList.remove('active');
            activeIndex = (activeIndex - 1 + maxIndex) % maxIndex;
            scenes[activeIndex].classList.add('active');
        });
    </script>
</body>
</html>
