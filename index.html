        #choices { display: flex; gap: 10px; margin-top: 5px; }
        .choice-btn { background: #1e293b; color: #00ffff; border: 1px solid #00ffff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }

       function renderScene() {
    let scene = script[state.currentScene];
    if (scene) {
        document.getElementById("speaker").innerText = scene.name;
        document.getElementById("story").innerText = scene.text;
        
        // Красим имена персонажей в их фирменные цвета
        let speakerEl = document.getElementById("speaker");
        if (scene.name.includes("Miku")) speakerEl.style.color = "#00ffff";
        else if (scene.name.includes("Luka")) speakerEl.style.color = "#ffb6c1";
        else if (scene.name.includes("Teto")) speakerEl.style.color = "#ff0055";
        else if (scene.name.includes("Gumi")) speakerEl.style.color = "#a3ff00";
        else speakerEl.style.color = "#39ff14";
    }
           
}

function nextDialogue() {
    let scene = script[state.currentScene];
    
    // Если сцена существует и у неё есть следующая сцена
    if (scene && scene.nextScene) {
        // Если это сцена битвы, клик по диалогу не должен её пропускать
        if (scene.isBattleScene) {
            return; 
        }
        state.currentScene = scene.nextScene;
        renderScene();
    }
}
