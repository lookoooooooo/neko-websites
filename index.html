<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>よら、私を信じてる？</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #d1d1d1;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #title-container {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2rem;
            color: #900;
            margin: 0;
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 0.8rem;
            color: #555;
            margin: 5px 0 0 0;
            font-style: italic;
        }

        #game-container {
            width: 80%;
            max-width: 800px;
            text-align: center;
        }

        #view-screen {
            width: 100%;
            height: 400px;
            background-color: #111;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
        }

        #view-screen img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #story-text {
            min-height: 60px;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        #inventory {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        button {
            background: none;
            border: 1px solid #444;
            color: #888;
            padding: 10px 30px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .interact-btn {
            font-size: 1rem;
            padding: 10px 20px;
            background-color: #200;
            border-color: #600;
            color: #b00;
        }

        .interact-btn:hover {
            background-color: #400;
            color: #f00;
            border-color: #900;
        }
    </style>
</head>
<body>

    <div id="title-container">
        <h1>よら、私を信じてる？</h1>
        <p class="subtitle">Yora, do you trust me?</p>
    </div>

    <div id="game-container">
        <div id="view-screen">
            <img id="scene-image" src="room_center.png" alt="Current Scene">
        </div>

        <div id="story-text">You wake up. The ceiling feels too low. The air smells like wet copper.</div>
        
        <div id="inventory">Inventory: Empty</div>

        <div class="controls">
            <button id="btn-left" onclick="move('left')">&lt;</button>
            <button id="btn-action" class="interact-btn" onclick="interact()">EXAMINE</button>
            <button id="btn-right" onclick="move('right')">&gt;</button>
        </div>
    </div>

    <script>
        const scenes = {
            center: {
                text: "A heavy wooden door stands before you. There is no handle.",
                image: "room_center.png",
                left: "left_wall",
                right: "right_wall",
                hasItem: false
            },
            left_wall: {
                text: "A stained mirror hangs here. Your reflection doesn't seem to blink when you do.",
                image: "room_left.png",
                left: "back_wall",
                right: "center",
                hasItem: true,
                item: "Glass Shard"
            },
            right_wall: {
                text: "An unmade bed. The blanket is damp. Something is shaking underneath it.",
                image: "room_right.png",
                left: "center",
                right: "back_wall",
                hasItem: false
            },
            back_wall: {
                text: "A small nightstand with an old, buzzing analog TV showing pure static.",
                image: "room_back.png",
                left: "right_wall",
                right: "left_wall",
                hasItem: false
            }
        };

        let currentScene = "center";
        let inventory = [];

        function updateScreen() {
            const scene = scenes[currentScene];
            document.getElementById("scene-image").src = scene.image;
            document.getElementById("story-text").innerText = scene.text;
            
            const actionBtn = document.getElementById("btn-action");
            if (scene.hasItem && !inventory.includes(scene.item)) {
                actionBtn.innerText = `TAKE ${scene.item.toUpperCase()}`;
                actionBtn.style.display = "inline-block";
            } else {
                actionBtn.innerText = "EXAMINE";
            }
        }

        function move(direction) {
            currentScene = scenes[currentScene][direction];
            updateScreen();
        }

        function interact() {
            const scene = scenes[currentScene];
            if (scene.hasItem && !inventory.includes(scene.item)) {
                inventory.push(scene.item);
                document.getElementById("inventory").innerText = "Inventory: " + inventory.join(", ");
                document.getElementById("story-text").innerText = `You picked up the ${scene.item}.`;
                document.getElementById("btn-action").innerText = "EXAMINE";
            } else {
                if (currentScene === "left_wall") {
                    document.getElementById("story-text").innerText = "You touch the cold glass. It cracks slightly.";
                } else if (currentScene === "right_wall") {
                    document.getElementById("story-text").innerText = "You reach for the blanket, but a sudden spike of anxiety paralyzes your hand.";
                } else {
                    document.getElementById("story-text").innerText = "Nothing happens.";
                }
            }
        }

        updateScreen();
    </script>
</body>
</html>
